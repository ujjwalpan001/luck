<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin dashboard for CheatingPap Web App. Configure links and monitor messages.">
    <title>Admin Dashboard | CheatingPap</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container admin-container">
        <!-- Header with Status Badge -->
        <header class="admin-header">
            <div class="admin-title-group">
                <h1>Admin Dashboard</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Monitor messages & configure redirects</p>
            </div>
            <div id="status-badge" class="status-badge offline">
                <span class="status-dot"></span>
                <span id="status-text">Checking...</span>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="admin-grid">
            <!-- Left Side: Config -->
            <div class="admin-panel">
                <h2 class="section-title" style="margin-bottom: 0.25rem;">Settings</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">Update the link for the customer's "Luck" button.</p>
                
                <div class="input-group">
                    <label for="luck-link-input" style="font-size: 0.9rem; font-weight: 500;">Luck Button URL</label>
                    <input type="url" id="luck-link-input" placeholder="https://example.com" autocomplete="off">
                </div>
                
                <button id="save-link-btn" class="btn btn-secondary" style="width: 100%;">Save Redirect Link</button>
            </div>

            <!-- Right Side: Message Feed -->
            <div class="admin-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <h2 class="section-title" style="margin-bottom: 0;">Messages Feed</h2>
                    <span id="message-count" style="font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 20px; background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border-color);">0 messages</span>
                </div>
                <div id="message-list" class="message-list">
                    <div class="no-messages">Loading messages...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toast-text">Settings updated!</span>
    </div>

    <script>
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const luckLinkInput = document.getElementById('luck-link-input');
        const saveLinkBtn = document.getElementById('save-link-btn');
        const messageList = document.getElementById('message-list');
        const messageCount = document.getElementById('message-count');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');

        let isOnline = false;

        // Show toast feedback
        function showToast(text, type = 'success') {
            toastText.textContent = text;
            toast.className = 'toast show';
            if (type === 'success') {
                toast.classList.add('toast-success');
            } else {
                toast.classList.add('toast-error');
            }
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Check Health (Online / Offline status indicator)
        async function checkStatus() {
            try {
                const response = await fetch('/api/health', { signal: AbortSignal.timeout(3000) });
                if (response.ok) {
                    if (!isOnline) {
                        statusBadge.className = 'status-badge online';
                        statusText.textContent = 'Online';
                        isOnline = true;
                    }
                } else {
                    throw new Error('Not OK response');
                }
            } catch (error) {
                if (isOnline || statusText.textContent === 'Checking...') {
                    statusBadge.className = 'status-badge offline';
                    statusText.textContent = 'Offline';
                    isOnline = false;
                }
            }
        }

        // Fetch Current Luck Link
        async function fetchLuckLink() {
            try {
                const response = await fetch('/api/luck-link');
                if (response.ok) {
                    const data = await response.json();
                    luckLinkInput.value = data.url || 'https://www.google.com';
                }
            } catch (error) {
                console.error('Error fetching luck link:', error);
            }
        }

        // Save Luck Link
        saveLinkBtn.addEventListener('click', async () => {
            const url = luckLinkInput.value.trim();
            if (!url) {
                showToast('URL cannot be empty.', 'error');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showToast('URL must start with http:// or https://', 'error');
                return;
            }

            saveLinkBtn.disabled = true;
            try {
                const response = await fetch('/api/luck-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('Luck button redirect link updated!');
                } else {
                    showToast(data.detail || 'Failed to update link.', 'error');
                }
            } catch (error) {
                console.error('Error saving link:', error);
                showToast('Network error while saving settings.', 'error');
            } finally {
                saveLinkBtn.disabled = false;
            }
        });

        // Format ISO Date to human-readable string
        formatTime = (isoString) => {
            try {
                const date = new Date(isoString);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return isoString;
            }
        }

        // Fetch Messages List
        async function fetchMessages() {
            try {
                const response = await fetch('/api/messages');
                if (!response.ok) throw new Error('Failed to fetch messages');
                
                const data = await response.json();
                const messages = data.messages || [];
                
                messageCount.textContent = `${messages.length} message${messages.length !== 1 ? 's' : ''}`;
                
                if (messages.length === 0) {
                    messageList.innerHTML = '<div class="no-messages">No messages sent yet.</div>';
                    return;
                }

                const listHtml = messages.map(msg => `
                    <div class="message-item">
                        <div class="message-content">${escapeHTML(msg.content)}</div>
                        <div class="message-time">${formatTime(msg.timestamp)}</div>
                    </div>
                `).join('');
                
                messageList.innerHTML = listHtml;
            } catch (error) {
                console.error('Error fetching messages:', error);
                // Keep showing messages list if offline, don't clear it immediately with error
            }
        }

        // Minimal HTML Escaper to prevent XSS
        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initialization and Polling Setup
        async function init() {
            await checkStatus();
            await fetchLuckLink();
            await fetchMessages();
            
            // Poll status every 3 seconds
            setInterval(checkStatus, 3000);
            // Poll messages feed every 4 seconds to show new ones
            setInterval(fetchMessages, 4000);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
